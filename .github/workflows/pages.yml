name: Deploy browser build to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # the build job also pushes the compiled app to the `build` branch
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install   # not `npm ci`: lockfile predates the cross-env dependency; run `npm install` locally and commit the lock to switch back
      - run: npm run build
        env:
          CI: false   # react-scripts 4 treats lint warnings as errors when CI=true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build
      # Also publish the compiled app to an orphan `build` branch, so it can be
      # fetched with plain git (clone -b build) and opened without npm.
      - name: Push build to `build` branch
        run: |
          cd build
          git init -q -b build
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build from ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" build:build
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
